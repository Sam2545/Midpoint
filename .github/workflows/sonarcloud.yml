name: SonarCloud (Maven)
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ADDED THIS for better analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # CHANGED from 21 to match your build.yml

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build & test
        working-directory: ./backend # ADDED THIS
        run: mvn -B clean verify

      - name: SonarCloud analysis
        working-directory: ./backend # ADDED THIS
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # ADDED THIS
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=Sam2545_Midpoint \
            -Dsonar.organization=sam2545 \
            -Dsonar.host.url=https://sonarcloud.io
